plugins {
    id 'com.android.application'
}

android {
    namespace 'com.htechdigital.globalopportunities'
    compileSdk 34

    defaultConfig {
        applicationId 'com.htechdigital.globalopportunities'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('APK_VERSION_CODE') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('SIGNING_STORE_FILE')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('SIGNING_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
