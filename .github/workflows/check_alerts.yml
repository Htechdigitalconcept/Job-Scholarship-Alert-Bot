name: Job & Scholarship Alert Scraper

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Lets you trigger a run manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper & broadcast to public channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBERS_GIST_ID: ${{ secrets.SUBSCRIBERS_GIST_ID }}
          SUBSCRIBERS_GITHUB_TOKEN: ${{ secrets.SUBSCRIBERS_GITHUB_TOKEN }}
        run: python scraper.py --digest-hour 6

      - name: Process pending user commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBSCRIBERS_GIST_ID: ${{ secrets.SUBSCRIBERS_GIST_ID }}
          SUBSCRIBERS_GITHUB_TOKEN: ${{ secrets.SUBSCRIBERS_GITHUB_TOKEN }}
        run: python bot_commands.py --once

      - name: Commit updated state files
        run: |
          if [ -n "$(git status --porcelain data/seen_items.json data/latest_items.json data/bot_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/seen_items.json data/latest_items.json data/bot_state.json
            git commit -m "chore: update seen items and bot cache [skip ci]"
            git push
          else
            echo "No new state changes to commit."
          fi
