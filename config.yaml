# Job & Scholarship Alert Bot Configuration
# Edit keywords and sources below to match what you're looking for.

settings:
  # Public Telegram channel & bot usernames (overridden if env vars/secrets are set)
  channel_id: "@latestjobsandscholarship"
  bot_username: "Scholar_job_bot"
  mini_app_url: "https://t.me/Scholar_job_bot/RJS"
  public_channel_url: "https://t.me/latestjobsandscholarship"
  public_site_url: "https://job-scholarship-alert-bot-chi.vercel.app"
  # Recommended affiliate / referral tools shown on the Web Board, Pitch modal, and /tools
  recommended_tools:
    - id: "raenest"
      badge: "💳 Remote USD / EUR / GBP Payouts"
      name: "Raenest — Global Foreign Bank Accounts"
      description: "Receive remote tech & Web3 salaries, freelance payouts, or scholarship stipends globally with USD, EUR & GBP accounts."
      cta: "Open Free Raenest Account ↗"
      button_label: "💳 Get USD/GBP Account (Raenest)"
      url: "https://referral.raenest.com/WzbV/i?referral_code=adehab359122"
  # Max number of new alerts to broadcast to the channel per run
  max_alerts_per_run: 15
  # Post one summary cycle reminder notification at the end of every cycle with new posts
  cycle_reminder: true
  # Send individual item posts silently so subscribers get one clean notification buzz per cycle
  quiet_item_alerts: true
  # Max number of recent opportunities to cache in data/latest_items.json for /latest, /jobs, /scholarships
  latest_cache_limit: 200
  # Only send posts published within this many days (can be overridden per category)
  max_post_age_days: 3
  # Keep posts that have no publish date (e.g. custom HTML pages without dates)
  allow_undated_posts: true
  # Keep seen item hashes for this many days before pruning old entries
  seen_retention_days: 90
  # HTTP timeout in seconds for each source
  request_timeout: 15
  # On the very first run (when data/seen_items.json does not exist),
  # set seed_only_on_first_run: true to mark existing items as seen without flooding your chat.
  seed_only_on_first_run: false

categories:
  jobs:
    label: "💼 Job Alert"
    max_post_age_days: 3
    include_keywords:
      - "python"
      - "backend"
      - "remote"
      - "junior"
      - "intern"
      - "internship"
      - "data analyst"
      - "software engineer"
    exclude_keywords:
      - "senior only"
      - "10+ years"
      - "principal"
      - "staff engineer"
    sources:
      - name: "Remotive Remote Jobs"
        type: "rss"
        url: "https://remotive.com/remote-jobs/feed"
        enabled: true
      - name: "We Work Remotely"
        type: "rss"
        url: "https://weworkremotely.com/remote-jobs.rss"
        enabled: true
      - name: "Himalayas Remote Jobs"
        type: "himalayas"
        url: "https://himalayas.app/jobs/api?limit=30"
        enabled: true
      - name: "Arbeitnow Remote & Visa"
        type: "arbeitnow"
        url: "https://www.arbeitnow.com/api/job-board-api"
        enabled: true
      # Example HTML source (disabled by default — customize selector for any career page)
      - name: "Example Custom Career Page"
        type: "html"
        url: "https://example.com/careers"
        enabled: false
        item_selector: "article.job-card"
        title_selector: "h2 a"
        link_selector: "h2 a"
        summary_selector: "p.summary"

  web3_jobs:
    label: "⛓️ Web3 Remote Job"
    max_post_age_days: 5
    require_keywords:
      - "remote"
      - "remotely"
    include_keywords:
      - "solidity"
      - "rust"
      - "web3"
      - "blockchain"
      - "smart contract"
      - "defi"
      - "zk"
      - "protocol"
      - "software engineer"
      - "backend"
      - "frontend"
      - "full-stack"
      - "fullstack"
      - "python"
      - "typescript"
      - "developer"
      - "researcher"
      - "product manager"
      - "analyst"
      - "intern"
    exclude_keywords:
      - "10+ years"
      - "principal"
    sources:
      - name: "Cryptocurrency Jobs"
        type: "rss"
        url: "https://cryptocurrencyjobs.co/index.xml"
        enabled: true
      - name: "CryptoJobsList"
        type: "rss"
        url: "https://cryptojobslist.com/rss"
        enabled: true

  scholarships:
    label: "🎓 Scholarship & Fellowship"
    max_post_age_days: 14
    include_keywords:
      - "fully funded"
      - "scholarship"
      - "fellowship"
      - "masters"
      - "msc"
      - "undergraduate"
      - "africa"
      - "nigeria"
      - "tech"
      - "stem"
    exclude_keywords:
      - "phd only"
      - "us citizens only"
    sources:
      - name: "Opportunity Desk"
        type: "rss"
        url: "https://opportunitydesk.org/feed/"
        enabled: true
      - name: "Opportunities For Africans"
        type: "rss"
        url: "https://www.opportunitiesforafricans.com/feed/"
        enabled: true
      - name: "Scholars4Dev"
        type: "rss"
        url: "https://www.scholars4dev.com/feed/"
        enabled: true
      - name: "Bright Scholarship"
        type: "rss"
        url: "https://brightscholarship.com/feed/"
        enabled: true
      - name: "Opportunities Corners"
        type: "rss"
        url: "https://opportunitiescorners.com/feed/"
        enabled: true
      - name: "AfterSchoolAfrica"
        type: "rss"
        url: "https://afterschoolafrica.com/feed/"
        enabled: true
